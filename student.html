    <script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAu4K1cgYCYdjx4m0dYgO0MpWkSWn-PjyA",
            authDomain: "study-tracker-4ae80.firebaseapp.com",
            projectId: "study-tracker-4ae80",
            storageBucket: "study-tracker-4ae80.firebasestorage.app",
            messagingSenderId: "329939564727",
            appId: "1:329939564727:web:cbbed64c2553656206b532"
        };

        firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();
        const auth = firebase.auth();

        console.log("🔥 Firebase 已初始化");

        auth.onAuthStateChanged(async function (user) {

            // 沒有登入
            if (!user) {

                window.location.replace("login.html");

                return;
            }


            try {

                // 查詢目前登入者角色
                const userDoc =
                    await db
                        .collection("users")
                        .doc(user.uid)
                        .get();


                // 不在允許名單
                if (!userDoc.exists) {

                    alert("⛔ 此帳號尚未取得使用權限");

                    await auth.signOut();

                    window.location.replace("login.html");

                    return;
                }


                const userData =
                    userDoc.data();


                // 學生可以進
                if (userData.role === "student") {

                    console.log(
                        "✅ 學生權限驗證成功：",
                        user.email
                    );

                    return;
                }


                // 教師也允許進學生頁
                // 方便你自己測試題目
                if (userData.role === "teacher") {

                    console.log(
                        "✅ 教師進入學生測試頁：",
                        user.email
                    );

                    return;
                }


                // 其他角色全部拒絕
                alert("⛔ 此帳號沒有學生系統權限");

                await auth.signOut();

                window.location.replace("login.html");


            } catch (error) {

                console.error(
                    "學生權限驗證失敗：",
                    error
                );

                alert(
                    "權限驗證失敗\n\n" +
                    error.message
                );

                window.location.replace("login.html");
            }

        });
    </script>
